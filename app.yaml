runtime: python312
service: default

handlers:
- url: /(.*\.(woff2|woff|ttf))$
  static_files: \1
  upload: (.*\.(woff2|woff|ttf))$
  expiration: "365d"

- url: /(styles\.css|speak2db-logo\.png|favicon\.ico|uk\.svg|spain\.svg|js/i18n\.js)$
  static_files: \1
  upload: (styles\.css|speak2db-logo\.png|favicon\.ico|uk\.svg|spain\.svg|js/i18n\.js)$
  expiration: "365d"

- url: /i18n/([^/]+\.json)$
  static_files: i18n/\1
  upload: i18n/([^/]+\.json)$
  expiration: "7d"

- url: /
  static_files: index.html
  upload: index.html

- url: /(.*)
  static_files: \1
  upload: (.*)