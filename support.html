<html lang="en">
<head>

  <title>Contact Speak2DB Support</title>

    #language-menu img { width: 20px; height: 20px; flex: none; }
  </style>

    <script type="application/json" id="i18n-es">{"page-title-support":"Contacta con el soporte de Speak2DB","support-eyebrow":"Soporte de Speak2DB","support-heading":"¿Cómo podemos ayudarte?","support-description":"Envíanos un mensaje y nuestro equipo te responderá por email.","support-email-label":"Dirección de email","support-email-placeholder":"tu@email.com","support-country-label":"País","support-country-placeholder":"p. ej., España","support-product-label":"¿Sobre qué producto es tu consulta?","support-product-placeholder":"Selecciona un producto","support-product-application":"Aplicación","support-product-excel":"Add-in de Excel","support-message-label":"Mensaje","support-message-placeholder":"Cuéntanos cómo podemos ayudarte (10 a 5.000 caracteres)","support-submit":"Enviar mensaje","support-sending":"Enviando...","support-success":"Tu mensaje se ha enviado. Responderemos a tu email lo antes posible.","support-error":"No hemos podido enviar tu mensaje. Inténtalo de nuevo.","support-error-email":"Introduce una dirección de email válida.","support-error-country":"Introduce un país válido.","support-error-product":"Selecciona un producto.","support-error-message":"El mensaje debe tener entre 10 y 5.000 caracteres.","support-error-captcha":"Completa la verificación de seguridad e inténtalo de nuevo.","support-privacy":"Usamos estos datos únicamente para responder a tu solicitud de soporte.","support-back":"Volver al inicio","language.select":"Seleccionar idioma","language.en":"Inglés","language.es":"Español","footer-copy":"© 2026 Speak2DB. Todos los derechos reservados."}</script>
</head>
<body data-page="support" class="min-h-screen flex flex-col">
  <header class="site-nav standalone-site-nav">
    <a href="/" aria-label="Speak2DB home">
      <img class="site-logo" src="speak2db-logo.png" alt="Speak2DB" title="Speak2DB">
    </a>
    <div id="language-selector" class="language-selector">
      <button id="language-trigger" type="button" onclick="toggleLanguageMenu()"
        class="inline-flex items-center gap-1.5 p-2 rounded-md bg-gray-600 hover:bg-gray-500 transition"
        title="Select language" aria-label="Select language" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu">
        <img id="language-flag" src="uk.svg" alt="" aria-hidden="true" class="w-5 h-5 rounded-full">
        <span id="language-code" class="text-xs font-semibold text-gray-100">EN</span>
        <span aria-hidden="true" class="text-xs text-gray-300">▾</span>
      </button>
      <div id="language-menu" role="menu" aria-label="Select language"
        class="hidden absolute right-0 top-full mt-1 min-w-32 rounded-md border border-gray-600 bg-gray-800 p-1 shadow-xl z-10">
        <button type="button" role="menuitemradio" data-language="es" onclick="selectSupportLanguage('es')"
          class="flex w-full items-center gap-2 rounded px-2 py-1.5 text-left text-xs text-gray-100 hover:bg-gray-700 focus:bg-gray-700 focus:outline-none">
          <span id="language-check-es" class="w-3 text-center"></span><img src="spain.svg" alt="" aria-hidden="true" class="w-5 h-5 rounded-full"><span data-key="language.es">Spanish</span>
        </button>
        <button type="button" role="menuitemradio" data-language="en" onclick="selectSupportLanguage('en')"
          class="flex w-full items-center gap-2 rounded px-2 py-1.5 text-left text-xs text-gray-100 hover:bg-gray-700 focus:bg-gray-700 focus:outline-none">
          <span id="language-check-en" class="w-3 text-center"></span><img src="uk.svg" alt="" aria-hidden="true" class="w-5 h-5 rounded-full"><span data-key="language.en">English</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-3xl mx-auto px-6 py-10 sm:py-16">
    <p class="text-sm uppercase tracking-[0.2em] text-blue-300 mb-4" data-key="support-eyebrow">Speak2DB support</p>
    <h1 class="text-4xl sm:text-5xl font-bold text-white mb-5" data-key="support-heading">How can we help?</h1>
    <p class="text-lg text-gray-300 mb-10" data-key="support-description">Send us a message and our team will get back to you by email.</p>

    <form id="support-form" class="bg-gray-800 border border-gray-700 rounded-2xl p-6 sm:p-8 shadow-xl space-y-6" novalidate>
      <div>
        <label for="support-email" class="block text-gray-200 font-medium mb-2" data-key="support-email-label">Email address</label>
        <input id="support-email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com" data-placeholder-key="support-email-placeholder"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="support-country" class="block text-gray-200 font-medium mb-2" data-key="support-country-label">Country</label>
        <input id="support-country" name="country" required minlength="2" maxlength="80" autocomplete="country-name" placeholder="e.g. Canada" data-placeholder-key="support-country-placeholder"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label for="support-product" class="block text-gray-200 font-medium mb-2" data-key="support-product-label">What does your request concern?</label>
        <select id="support-product" name="product" required class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="" data-key="support-product-placeholder">Select a product</option>
          <option value="application" data-key="support-product-application">Application</option>
          <option value="excel_addin" data-key="support-product-excel">Excel add-in</option>
        </select>
      </div>
      <div>
        <label for="support-message" class="block text-gray-200 font-medium mb-2" data-key="support-message-label">Message</label>
        <textarea id="support-message" name="message" required minlength="10" maxlength="5000" rows="7" placeholder="Tell us how we can help (10 to 5,000 characters)" data-placeholder-key="support-message-placeholder"
          class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div id="turnstile-widget" class="flex justify-center"></div>
      <button type="submit" id="support-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed" data-key="support-submit">Send message</button>
      <p id="support-status" class="hidden rounded-lg p-4" role="status" aria-live="polite"></p>
      <p class="text-xs text-gray-500" data-key="support-privacy">We use this information only to answer your support request.</p>
    </form>
    <div class="text-center mt-8">
      <a href="/" class="text-blue-300 hover:text-blue-200 underline" data-key="support-back">Back to home</a>
    </div>
  </main>

  <footer class="text-center text-gray-500 text-sm pb-8"><p data-key="footer-copy">© 2026 Speak2DB. All rights reserved.</p></footer>

  <script>
    const SUPPORT_API = 'https://platform.speak2db.com/support/api/support/contact';
    const TURNSTILE_SITE_KEY = '0x4AAAAAAD_IwFhPkPvsq1d2';
    let turnstileToken = '';
    let widgetId = null;
    let supportLanguage = 'en';

    function supportT(key) {
      const lang = supportLanguage;
      const el = document.getElementById('i18n-' + lang) || document.getElementById('i18n-en');
      try { return JSON.parse(el.textContent)[key] || ''; } catch (e) { return ''; }
    }

    function toggleLanguageMenu() {
      const menu = document.getElementById('language-menu');
      const trigger = document.getElementById('language-trigger');
      const open = menu.classList.toggle('hidden') === false;
      trigger.setAttribute('aria-expanded', String(open));
      if (open) menu.querySelector('[role="menuitemradio"]')?.focus();
    }

    function renderLanguageSelector() {
      const isEs = supportLanguage === 'es';
      document.getElementById('language-flag').src = isEs ? 'spain.svg' : 'uk.svg';
      document.getElementById('language-code').textContent = supportLanguage.toUpperCase();
      document.getElementById('language-trigger').title = supportT('language.select');
      document.getElementById('language-trigger').setAttribute('aria-label', supportT('language.select'));
      document.getElementById('language-menu').setAttribute('aria-label', supportT('language.select'));
      document.getElementById('language-check-es').textContent = isEs ? '✓' : '';
      document.getElementById('language-check-en').textContent = isEs ? '' : '✓';
      document.querySelectorAll('[role="menuitemradio"]').forEach(item => {
        item.setAttribute('aria-checked', String(item.dataset.language === supportLanguage));
      });
    }

    async function selectSupportLanguage(language) {
      supportLanguage = language;
      await setLanguage(language);
      renderLanguageSelector();
      const menu = document.getElementById('language-menu');
      menu.classList.add('hidden');
      document.getElementById('language-trigger').setAttribute('aria-expanded', 'false');
    }

    function loadTurnstile() {
      window.turnstileReady = () => {
        widgetId = window.turnstile.render(document.getElementById('turnstile-widget'), {
          sitekey: TURNSTILE_SITE_KEY,
          theme: 'dark',
          callback: token => { turnstileToken = token; },
          'expired-callback': () => { turnstileToken = ''; },
          'error-callback': () => { turnstileToken = ''; }
        });
      };
      const script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=turnstileReady&render=explicit';
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    function showStatus(key, success) {
      const status = document.getElementById('support-status');
      status.textContent = supportT(key);
      status.className = success
        ? 'rounded-lg p-4 bg-green-900/30 border border-green-700 text-green-300'
        : 'rounded-lg p-4 bg-red-900/30 border border-red-700 text-red-300';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const preferred = localStorage.getItem('language');
      const browserLanguage = (navigator.language || navigator.userLanguage || 'en').slice(0, 2);
      supportLanguage = preferred === 'es' || (!preferred && browserLanguage === 'es') ? 'es' : 'en';
      renderLanguageSelector();
      document.addEventListener('mousedown', event => {
        const selector = document.getElementById('language-selector');
        if (!selector.contains(event.target)) {
          document.getElementById('language-menu').classList.add('hidden');
          document.getElementById('language-trigger').setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          document.getElementById('language-menu').classList.add('hidden');
          document.getElementById('language-trigger').setAttribute('aria-expanded', 'false');
        }
      });
      loadTurnstile();
      document.getElementById('support-form').addEventListener('submit', async event => {
        event.preventDefault();
        const form = event.target;
        const email = document.getElementById('support-email').value.trim();
        const country = document.getElementById('support-country').value.trim();
        const product = document.getElementById('support-product').value;
        const message = document.getElementById('support-message').value.trim();
        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && email.length <= 254;
        if (!emailOk) return showStatus('support-error-email', false);
        if (!/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .'-]{1,79}$/.test(country)) return showStatus('support-error-country', false);
        if (!product) return showStatus('support-error-product', false);
        if (message.length < 10 || message.length > 5000) return showStatus('support-error-message', false);
        if (!turnstileToken) return showStatus('support-error-captcha', false);

        const button = document.getElementById('support-submit');
        button.disabled = true;
        button.textContent = supportT('support-sending');
        try {
          const response = await fetch(SUPPORT_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Turnstile-Token': turnstileToken },
            body: JSON.stringify({ email, country, product, message, lang: typeof currentLanguage !== 'undefined' ? currentLanguage : 'en' })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.ERROR_CODE || 'ERR_SUPPORT');
          showStatus('support-success', true);
          form.reset();
          turnstileToken = '';
          if (window.turnstile && widgetId !== null) window.turnstile.reset(widgetId);
        } catch (error) {
          showStatus(error.message === 'ERR_TURNSTILE_INVALID' ? 'support-error-captcha' : 'support-error', false);
        } finally {
          button.disabled = false;
          button.textContent = supportT('support-submit');
        }
      });
    });
  </script>
  <script src="js/i18n.js?v=1efd788519ef"></script>
</body>
</html>
